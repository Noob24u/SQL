version: 2

models:
  - name: core_all_brands__zendesk_ticket_metrics
    description: >
      Presentation-layer fact table: one row per ticket, across all brands and
      countries. This is the table a dashboard or analyst queries directly --
      everything upstream exists to feed this. Filters out tickets whose
      group didn't map to a known brand/country (see src_zendesk__groups).
    columns:
      - name: id
        description: Zendesk ticket ID.
        tests:
          - unique
          - not_null
      - name: brand
        description: Brand the ticket belongs to, derived from the Zendesk group it was routed to.
      - name: country_name
        description: Country the ticket belongs to, derived from the Zendesk group it was routed to.
      - name: via_channel
        description: "How the ticket was created, e.g. email, web, chat, voice, api."
      - name: priority
        description: Zendesk priority (low/normal/high/urgent).
      - name: status
        description: Current ticket status (new/open/pending/hold/solved/closed).
      - name: first_internal_comment_added
        description: Timestamp of the first agent/admin comment -- basis for First Response Time (FRT).
      - name: first_external_comment_added
        description: Timestamp of the first end-user comment.
      - name: is_proactive_ticket
        description: >
          'True' when the ticket was opened by an agent/admin on a non-voice,
          non-chat channel (i.e. the business reached out first, rather than
          the customer). Proactive tickets are typically excluded from
          customer-initiated SLA metrics like FRT.
      - name: contact_reason
        description: Primary reason the customer contacted support (mapped from the ticket form).
      - name: secondary_reason
        description: More granular reason within the primary contact reason, where collected.
      - name: actions
        description: The action taken by the agent to resolve the ticket, where collected.
      - name: full_resolution_time_in_minutes
        description: >
          Minutes from ticket creation to solved, adjusted to only count
          Mon-Fri 07:00-18:00 Europe/Berlin business hours. See known
          limitations re: DST and non-EU timezones.
      - name: resolution_time_in_days
        description: full_resolution_time_in_minutes converted to whole business days (bucketed at 1400 min/day).
      - name: last_assigned
        description: Zendesk user ID of the last agent assigned to the ticket.
      - name: last_assignee_name
        description: >
          Human-readable name for last_assigned, joined from a name-mapping
          seed and falling back to the raw ID when no mapping exists (see
          "Bugs fixed" in the README for a fix applied to this column's join).
      - name: number_of_agents_assigned
        description: Count of distinct agents assigned to the ticket over its lifetime -- a hand-off/churn indicator.
      - name: count_public_agent_comments
        description: Count of public (customer-visible) agent/admin replies.
      - name: total_comments
        description: Total comments on the ticket, public and internal, from any role.
      - name: is_one_touch_resolution
        description: True when the ticket was resolved in fewer than 2 public agent replies.
      - name: is_two_touch_resolution
        description: True when the ticket was resolved in exactly 2 public agent replies.
      - name: handling_time_in_sec
        description: Total agent handling time in seconds (Average Handling Time / AHT is this, averaged across tickets).

  - name: core_all_brands__zendesk_new_open_ticket_daily
    description: >
      Daily feed of tickets whose status was "new" or "open" as of their
      first status-history entry that day -- used to track incoming/unresolved
      ticket volume day over day.
    columns:
      - name: ticket_id
        tests:
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['new', 'open']
